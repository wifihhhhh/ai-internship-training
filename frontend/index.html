<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习知识库助手</title>
    <style>
        body {
          max-width: 850px;
          margin: 40px auto;
          padding: 0 20px;
          font-family: sans-serif;
          line-height: 1.7;
        }
        textarea {
          width: 100%;
          min-height: 100px;
        }
        button {
          margin: 12px 0;
          padding: 8px 20px;
        }
        pre {
          white-space: pre-wrap;
          background: #f4f5f7;
          padding: 16px;
        }
    </style>
</head>
<body>
    <h1>学习知识库助手</h1>

    <textarea id="question">为什么修改任务后需要让缓存失效？</textarea>
    <br>
    <button id="ask">提问</button>

    <p id="status"></p>
    <pre id="answer"></pre>

    <h2>引用来源</h2>
    <ul id="sources"></ul>

    <script>
        const button = document.querySelector("#ask");
        const status = document.querySelector("#status");
        const answer = document.querySelector("#answer");
        const sources = document.querySelector("#sources");

        button.addEventListener("click", async () => {
            const question = document.querySelector("#question").value.trim()

            if (!question) {
                status.textContent = "请先输入问题。";
                return ;
            }

            button.disabled = true;
            status.textContent = "正在检索并生成回答……";
            answer.textContent = "";
            sources.replaceChildren();

            try {
                const response = await fetch("/rag/ask", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({question, k: 3})
                });

                const data = await response.json()

                if (!response.ok) {
                    throw new Error(JSON.stringify(data.detail));
                }

                answer.textContent = data.answer;
                status.textContent = `耗时 ${data.elapsed_ms} ms，检索 ${data.retrieved_count} 块`;

                for (const source of data.sources) {
                    const item = document.createElement("li");

                    // 用 textContent，避免把模型文本当成 HTML 执行。
                    item.textContent = `${source.source}: ${source.quote}`;
                    sources.appendChild(item);
                }
            } catch (error) {
                status.textContent = `失败：${error.message}`;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
